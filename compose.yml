services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: tracksplitter-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMqOptions__UserName}
      RABBITMQ_DEFAULT_PASS: ${RabbitMqOptions__Password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: tracksplitter-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DbName}
      POSTGRES_USER: ${DbUser}
      POSTGRES_PASSWORD: ${DbPassword}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DbUser} -d ${DbName}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .  
    container_name: tracksplitter-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DbName};Username=${DbUser};Password=${DbPassword}"
      RabbitMqOptions__ServerHost: rabbitmq
      RabbitMqOptions__UserName: ${RabbitMqOptions__UserName}
      RabbitMqOptions__Password: ${RabbitMqOptions__Password}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
  postgres-data:
