services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: tracksplitter-rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMqOptions__UserName:-guest}
      RABBITMQ_DEFAULT_PASS: ${RabbitMqOptions__Password:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq-data:
